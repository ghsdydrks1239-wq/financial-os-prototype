name: Update READ LIST

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/run-news-now
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

jobs:
  update-read-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update READ LIST
        run: pnpm update:read-list
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit updated READ LIST
        run: |
          if git diff --quiet -- client/src/data/read-list.json; then
            echo "No READ LIST changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/read-list.json
          git commit -m "Update READ LIST"
          git push

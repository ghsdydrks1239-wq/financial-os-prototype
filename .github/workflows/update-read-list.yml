name: Update READ LIST

on:
  workflow_dispatch:
  schedule:
    # 07:30 / 07:45 / 08:00 / 08:35 KST = 22:30 / 22:45 / 23:00 / 23:35 UTC (previous UTC day)
    - cron: '30 22 * * *'
    - cron: '45 22 * * *'
    - cron: '0 23 * * *'
    - cron: '35 23 * * *'

permissions:
  contents: write

concurrency:
  group: update-read-list
  cancel-in-progress: false

jobs:
  update-read-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check whether today's scheduled update is already complete
        id: freshness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run requested. Running update regardless of today's existing data."
            exit 0
          fi

          TODAY=$(TZ=Asia/Seoul date +%F)
          DATA_DATE=$(node -e "const fs=require('fs'); try { const j=JSON.parse(fs.readFileSync('client/src/data/read-list.json','utf8')); process.stdout.write(j.date || '') } catch { process.stdout.write('') }")

          if [ "$DATA_DATE" = "$TODAY" ]; then
            echo "Today's data already exists ($TODAY). Skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Today's data is missing or stale (found: ${DATA_DATE:-none}, expected: $TODAY). Running update."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.freshness.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Update READ LIST
        if: steps.freshness.outputs.skip != 'true'
        run: pnpm update:read-list
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit updated READ LIST
        if: steps.freshness.outputs.skip != 'true'
        run: |
          if git diff --quiet -- client/src/data/read-list.json; then
            echo "No READ LIST changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/data/read-list.json
          git commit -m "Update READ LIST"
          git pull --rebase origin main
          git push
